ck in an exchange rate. Banks, payment networks, blockchains and other providers may affect  processing times. Responsibility for losses caused by incorrect recipient details, wallet addresses, blockchain  networks or other instructions you provide, or by actions you take without authorisation, is  determined by the relevant product agreement and applicable law. We will nevertheless provide  reasonable assistance with investigation and resolution where practicable.</p><h3>5. Visa card and third-party services</h3><p>Visa Worldwide Pte. Limited is the name supplied for the Visa entity involved in this card  programme. The legal card issuer, programme manager and their respective responsibilities are  those expressly identified as such on the card application page and in the cardholder agreement.  Card applications, issuance, funding, use, freezing, refunds, fees and disputes are subject to the  cardholder agreement, card scheme rules and applicable law. The ability to add a card to Apple  Pay, Google Pay, WeChat Pay or Alipay depends on the card, device, location and support from  the relevant platform. Payment scenarios shown on this website do not guarantee availability to  every user, merchant or region. Multi-currency receiving accounts and other third-party services may also be subject to the  relevant provider&#x27;s eligibility criteria, rules and privacy notice. The provider will be identified  during the application process.</p><h3>6. Acceptable use</h3><p>You must not use the website or services for unlawful activity, fraud, money laundering,  sanctions evasion, infringement of others&#x27; rights or conduct that compromises system security.  You must not access an account without authorisation, extract non-public data, distribute  malicious code or interfere with the website. Keep your login credentials secure and promptly  report suspected unauthorised use through your account&#x27;s help function or an official website  contact channel.</p><h3>7. Intelle vacy) Ordinance (Cap. 486) and other applicable laws, and restrict processors  acting on our behalf to agreed purposes. If additional overseas recipient locations are introduced, we will update the notice as required by applicable law.</p><h3>6. Automated tools</h3><p>We may use optical character recognition, rules-based systems, data analytics and approved  automated tools to assist with reading documents, verifying identities, detecting fraud, screening  names, monitoring transactions and providing support. Circumstances requiring human review,  significant decisions that may affect service eligibility, and review channels depend on the actual  product process and applicable law. This Policy does not replace a specific compliance review  procedure.</p><h3>7. Cookies and website analytics</h3><p>The website may use necessary cookies for language settings, security and basic functions. If we  use non-essential analytics or marketing technologies, we will provide notice and choices as  required. You may also manage cookies in your browser, although disabling certain necessary  features may affect the website.</p><h3>8. Retention and security</h3><p>We retain information for as long as needed to provide services, meet legal duties, resolve  disputes and maintain security. Retention periods vary by data category. Closing an account does  not necessarily result in immediate deletion of identity and transaction records that must be kept  by law. At the end of the applicable retention period, we will delete or de-identify data as  required. We use access controls, protections for transmission and storage, log monitoring and staff  permission management proportionate to the risk. No system can guarantee absolute security.  We will handle and notify relevant parties of a privacy incident where required by applicable  law.</p><h3>9. Your choices, access and correction</h3><p>You may request access to or correction of personal data we hold, subject to applicable law, and  con
