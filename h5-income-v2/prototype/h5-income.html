p>GEX USDT Income is designed for eligible customers who purchase USDT through GEXFI and wish to allocate a portion of their balance for a defined period. The product has three terms: 90 days, 180 days and 365 days. Subscriptions, income illustrations and redemption amounts are denominated in USDT.<\/p><p>The product connects income holdings with GEXFI Wallet and, separately, eligible card funding services. An Income holding is not available wallet cash and cannot be spent directly using a card. At maturity, the redemption process returns the payable amount to the customer’s GEXFI Wallet before any further transfer or card funding transaction.<\/p><h3>Product at a glance<\/h3><div class=\"table-scroll\"><table class=\"\"><thead><tr><th>Feature<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>Product name<\/td><td>GEX USDT Income<\/td><\/tr><tr><td>Denomination<\/td><td>USDT<\/td><\/tr><tr><td>Terms<\/td><td>90, 180 or 365 calendar days<\/td><\/tr><tr><td>Target annualized rates<\/td><td>3.80%, 4.50% and 5.00%, respectively<\/td><\/tr><tr><td>Rate basis<\/td><td>Net of the product management fee; before separate transaction costs and personal taxes<\/td><\/tr><tr><td>Eligible funding<\/td><td>Qualifying USDT purchased through GEXFI<\/td><\/tr><tr><td>Access to funds<\/td><td>Fixed term; redemption at maturity, under the applicable redemption terms<\/td><\/tr><tr><td>Minimum subscription<\/td><td>The current minimum and maximum are displayed before subscription confirmation<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\">Target returns are objectives, not a guarantee. The amount ultimately payable may be lower than an illustration, and capital may be lost. This is not a bank deposit or a Tether-issued income product.<\/aside><h3>Who should consider the product?<\/h3><p>Customers should be able to leave the subscription amount invested for the full term and accept investment and digital-asset risks. The product is not designed for emergency funds or balances needed for near-term spending. Eligibility remains subject to account approval, product availability and applicable service restrictions.<\/p>"}, {"id": "terms", "number": "02", "title": "Terms & target returns", "intro": "Compare the annualized target and the illustrative return over each full term.", "body": "<div class=\"table-scroll\"><table class=\"rate-table\"><thead><tr><th>Product<\/th><th>Term<\/th><th>Net target p.a.<\/th><th>Illustrative term return<\/th><\/tr><\/thead><tbody><tr><td>USDT Income 90<\/td><td>90 days<\/td><td><b>3.80%<\/b><\/td><td>0.9370%<\/td><\/tr><tr><td>USDT Income 180<\/td><td>180 days<\/td><td><b>4.50%<\/b><\/td><td>2.2192%<\/td><\/tr><tr><td>USDT Income 365<\/td><td>365 days<\/td><td><b>5.00%<\/b><\/td><td>5.0000%<\/td><\/tr><\/tbody><\/table><\/div><p>Rates are expressed on an annualized, simple-interest basis using a 365-day denominator. They are not APYs and do not assume reinvestment or compounding. A 3.80% annual target over 90 days does not mean a 3.80% return after 90 days.<\/p><h3>Illustration: 1,000 USDT for one full term<\/h3><div class=\"table-scroll\"><table class=\"\"><thead><tr><th>Term<\/th><th>Target income<\/th><th>Principal + target income<\/th><\/tr><\/thead><tbody><tr><td>90 days<\/td><td>9.37 USDT<\/td><td>1,009.37 USDT<\/td><\/tr><tr><td>180 days<\/td><td>22.19 USDT<\/td><td>1,022.19 USDT<\/td><\/tr><tr><td>365 days<\/td><td>50.00 USDT<\/td><td>1,050.00 USDT<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\">Illustrations assume the full amount is accepted, held for the entire term and earns the stated target. Figures are rounded to two decimals for display. They are not forecasts of actual performance, confirmed payment amounts or minimum subscription amounts.<\/aside><h3>Your subscription confirmation<\/h3><p>Your subscription confirmation identifies the product, accepted amount, target rate, fee basis, start date, maturity date and applicable document version. The effective start and maturity timestamps are recorded in the confirmation. Calculations use the full underlying precision; customer-facing illustrations are rounded to two decimals, and the settlement statement records the payable USDT amount and any rounding adjustment. A rate shown for a new product is not authority to rewrite an existing customer’s agreed terms.<\/p><h3>No automatic reinvestment assumption<\/h3><p>Maturity does not imply automatic renewal. Any future reinvestment would require a separate instruction or an expressly agreed mandate, at the terms available for that new subscription.<\/p>"}, {"id": "eligibility", "number": "03", "title": "Eligibility & subscriptions", "intro": "The initial product is limited to qualifying GEXFI-purchased USDT.", "body": "<p>A GEXFI account or wallet balance does not itself establish product eligibility. Account and product checks apply. Direct external-USDT deposits are not eligible for the initial Income product.<\/p><div class=\"table-scroll\"><table class=\"\"><thead><tr><th>Funding source<\/th><th>Initial product treatment<\/th><\/tr><\/thead><tbody><tr><td>Qualifying USDT bought through GEXFI<\/td><td>May be used for subscription after purchase settlement and eligibility checks<\/td><\/tr><tr><td>USDT deposited directly from an external wallet<\/td><td>Not eligible for Income subscription<\/td><\/tr><tr><td>A balance reserved for another transaction<\/td><td>Not available for a new subscription<\/td><\/tr><tr><td>Unsettled or pending purchase proceeds<\/td><td>Not eligible until settlement and any required review are complete<\/td><\/tr><tr><td>Visa Card balance<\/td><td>Not treated as subscription funds merely because the card is linked<\/td><\/tr><\/tbody><\/table><\/div><h3>Subscription process<\/h3><div class=\"steps\"><div class=\"step\"><span>01<\/span><div><h3>Review the product<\/h3><p>Select a term, read the memorandum and applicable agreements, and review the target return and exit rules.<\/p><\/div><\/div><div class=\"step\"><span>02<\/span><div><h3>Confirm eligible funds<\/h3><p>Check the settled, available amount eligible for subscription. Calculator presets do not establish a minimum investment.<\/p><\/div><\/div><div class=\"step\"><span>03<\/span><div><h3>Submit your instruction<\/h3><p>Confirm the amount and required acknowledgements. An instruction is not accepted merely because it has been submitted.<\/p><\/div><\/div><div class=\"step\"><span>04<\/span><div><h3>Receive confirmation<\/h3><p>An accepted subscription is recorded separately from available wallet funds. The confirmation establishes the applicable dates and terms.<\/p><\/div><\/div><\/div><p>The account presents the applicable subscription limits and service availability before an instruction can be confirmed. Only settled, eligible funds can be reserved. If an instruction is declined or cancelled before acceptance, its reservation is released without creating an Income holding. Restricted accounts or unmatched payments may require further verification. Income is not attributed to a period before the confirmed start date.<\/p>"}, {"id": "income-fees", "number": "04", "title": "Income calculation & fees", "intro": "The displayed annual targets already reflect the 0.50% p.a. product management fee.", "body": "<div class=\"formula\">Illustrative income = principal × net annual target × term days ÷ 365<\/div><p>For 1,000 USDT over 180 days, the illustration is 1,000 × 4.50% × 180 ÷ 365 = 22.1917808 USDT, displayed as 22.19 USDT. A daily target-equivalent calculation is an accrual illustration, not a promise of a daily cash payment.<\/p><h3>Income records and settlement<\/h3><p>Holdings may display target accruals and subsequently confirmed income. The interface and statements must distinguish estimated amounts, confirmed amounts and amounts paid. Seeing a number on a daily chart does not mean that the same amount can be withdrawn that day. The settlement statement distinguishes the target illustration from the realized result, identifies any shortfall and shows the actual amount payable. Income is settled with the holding at maturity under the subscription terms; a daily record is not a separate daily distribution.<\/p><div class=\"table-scroll\"><table class=\"\"><thead><tr><th>Fee or cost<\/th><th>How it is presented<\/th><\/tr><\/thead><tbody><tr><td>Product management fee<\/td><td>0.50% p.a., already reflected in the net target rates. It is not deducted a second time from the stated net target income.<\/td><\/tr><tr><td>Purchase and exchange services<\/td><td>The quote may include an exchange-rate margin. Review the total amount payable and net amount receivable before accepting.<\/td><\/tr><tr><td>Card funding and card use<\/td><td>Separate services, with applicable fees and the resulting credit shown under the relevant quote or card terms.<\/td><\/tr><tr><td>Blockchain transfers<\/td><td>Network or transfer costs may apply where a blockchain withdrawal is requested.<\/td><\/tr><tr><td>Taxes<\/td><td>Personal tax treatment is not included in the displayed target rates.<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\">“Net target” means after the stated product management fee. It does not mean after all purchase, exchange, transfer, card or personal tax costs. No claim is made that this product is fee-free.<\/aside><p>The product fee schedule supplied before confirmation identifies the calculation base, collection timing and fee recipient. There is no second 0.50% deduction from the stated net target income. A separate service charge requires its own disclosed quote; it is not silently deducted as another management fee. Internal trading costs and commercial margins are not represented as investment returns.<\/p>"}, {"id": "management", "number": "05", "title": "Management, governance & asset holding", "intro": "A defined governance process, with legal responsibilities set out in the subscription documents.", "body": "<h3>Eternova institutional background<\/h3><p>The governance design draws on the framework described in the 2025 Investment Memorandum for Silver Fern No.1 Fund. That document identifies Eternova GP Limited as the general partner and records FSP554706 as its financial service provider reference, with responsibilities for operations, compliance oversight and fiduciary duties. Its framework includes an investment committee, risk committee, non-executive oversight and documented decisions. [2]<\/p><p>This is institutional background, not a statement that Silver Fern No.1 Fund issues or guarantees GEX USDT Income. The legacy fund’s assets, investor rights and third-party appointments are not transferred by this memorandum. An FSP reference is not, by itself, a financial-services licence or product approval. [3]<\/p><div class=\"table-scroll\"><table class=\"\"><thead><tr><th>Function<\/th><th>Responsibility within the product<\/th><\/tr><\/thead><tbody><tr><td>GEXFI customer interface<\/td><td>Product information, account access, subscription records, statements and wallet / card service connections.<\/td><\/tr><tr><td>Issuer and contracting party<\/td><td>The entity named in the subscription agreement assumes the obligations stated there. Customers receive its legal name and the nature of their claim before committing funds.<\/td><\/tr><tr><td>Investment management<\/td><td>The manager identified in the subscription documents administers allocation, exposure limits and income settlement under its mandate.<\/td><\/tr><tr><td>Asset holding and custody<\/td><td>The asset-holding terms identify the actual account holder, custody arrangements and customer rights. A bank deposit provider is not described as an independent custodian merely because it holds a deposit.<\/td><\/tr><\/tbody><\/table><\/div><h3>Investment and operational controls<\/h3><p>The control framework separates investment approvals, treasury execution, financial reconciliation and risk review. It provides for recorded decisions, related-party conflict review and escalation of discrepancies. Internal oversight is distinct from any separately contracted audit, trustee or statutory supervision service.<\/p><h3>Assets and customer rights<\/h3><p>USDT is the denomination of the product, not a promise that all assets remain in USDT. The asset strategy uses fiat bank deposits and cash-liquidity arrangements, with conversion and hedging managed internally. Customers should read the asset-holding terms for legal ownership, segregation, control and insolvency treatment. A customer ledger is not, by itself, proof of a trust, security interest or independent custody.<\/p>"}, {"id": "maturity", "number": "06", "title": "Maturity & redemption", "intro": "Redemption follows maturity and settlement; it is not an on-demand withdrawal.", "body": "<p>The 90-day, 180-day and 365-day products are intended to be held for their selected calendar-day term. There is no flexible product in this range. The accepted subscription confirmation records the start and maturity dates and the applicable redemption instruction.<\/p><div class=\"steps\"><div class=\"step\"><span>01<\/span><div><h3>Maturity reached<\/h3><p>The holding enters its maturity settlement process. An elapsed term does not, on its own, create available wallet funds.<\/p><\/div><\/div><div class=\"step\"><span>02<\/span><div><h3>Income and payable amount confirmed<\/h3><p>The settlement statement records principal, actual income, applicable disclosed deductions and the net redemption amount.<\/p><\/div><\/div><div class=\"step\"><span>03<\/span><div><h3>Wallet credited<\/h3><p>The payable USDT amount is credited to GEXFI Wallet once settlement and required checks are complete. A processing record is not a completed credit.<\/p><\/div><\/div><div class=\"step\"><span>04<\/span><div><h3>Funds used or reinvested<\/h3><p>After credit, the customer can select available wallet, transfer or card services. A new subscription requires its own accepted instruction.<\/p><\/div><\/div><\/div><h3>Settlement timing<\/h3><p>The timing and business-day convention applicable to an order are supplied before confirmation and retained with that order. The account displays the expected settlement date and progress. Maturity does not imply T+0 payment, and an internal wallet credit does not mean that a bank or card has also been credited.<\/p><h3>Early exit and cancellation<\/h3><p>An instruction can only be cancelled before acceptance where the account permits it. Accepted fixed-term holdings are not available for ordinary early withdrawal. Any exceptional exit permitted by law or accepted under the agreement is assessed separately; the quoted income adjustment and disclosed costs require the customer’s acceptance. No secondary-market buyer or platform repurchase is promised.<\/p><h3>Delays, failed settlement and renewal<\/h3><p>A required verification, account restriction, disputed instruction or execution failure may interrupt settlement. The customer record preserves the amount, reason and status until resolution; a failed transaction is not labelled completed. Customer communications follow the applicable agreement. No automatic renewal is assumed: reinvestment requires a new instruction or an express mandate, with the new term and rate disclosed in advance.<\/p>"}, {"id": "records-card", "number": "07", "title": "Wallet, card & digital records", "intro": "Connected services, with separate balances and a clear transaction record.", "body": "<h3>Wallet first, card second<\/h3><p>At the end of the redemption process, funds return to GEXFI Wallet. Card funding is optional and separate. A customer is not required to load a card in order to receive a redemption to the wallet. Card availability, limits and acceptance depend on the relevant card programme.<\/p><p>Before a card funding transaction, the customer should be shown the funding asset, quoted rate, applicable charges, amount to be credited, quote validity and expected processing terms. USDT-denominated holdings are not automatically USD-denominated card money, and no 1:1 conversion is assumed.<\/p><div class=\"table-scroll\"><table class=\"\"><thead><tr><th>Record<\/th><th>What it establishes<\/th><\/tr><\/thead><tbody><tr><td>Subscription confirmation<\/td><td>The accepted order, amount, term, dates and applicable document version<\/td><\/tr><tr><td>Income record<\/td><td>Whether an amount is an estimate, a confirmed allocation or a payment<\/td><\/tr><tr><td>Redemption record<\/td><td>The request, progress and actual settlement outcome<\/td><\/tr><tr><td>Wallet / card transaction<\/td><td>The separate transfer, conversion or card credit actually completed<\/td><\/tr><tr><td>Blockchain receipt, where implemented<\/td><td>Evidence of the stated transaction on the stated network, subject to confirmation<\/td><\/tr><\/tbody><\/table><\/div><h3>On-chain evidence<\/h3><p>If a blockchain record is made available, the network, transaction hash, record type and confirmation status should be identified. A receipt does not independently establish ownership of every underlying asset, the solvency of the issuer or a guaranteed investment value.<\/p><aside class=\"note\">A digital receipt does not, by itself, create a tradable investment token, free transferability or a secondary market. Any verification link must correspond to an actual record on the stated network. No sample hash is evidence of a live transaction.<\/aside><h3>Security and corrections<\/h3><p>Customers should verify instructions through their account and report discrepancies promptly. Corrections to records should preserve the original transaction trail and explain the change. Public blockchain records must not be treated as a substitute for the investment agreement.<\/p>"}, {"id": "risks", "number": "08", "title": "Principal risks", "intro": "Consider the potential loss and access restrictions alongside the target rate.", "body": "<div class=\"table-scroll\"><table class=\"\"><thead><tr><th>Risk<\/th><th>What it can mean for the customer<\/th><\/tr><\/thead><tbody><tr><td>Capital and performance<\/td><td>The target may not be achieved. Losses may reduce income or principal; a target rate is not a contractual guarantee of payment.<\/td><\/tr><tr><td>Issuer and counterparty<\/td><td>Failure of the issuer, bank, execution provider or another counterparty may delay payments or cause loss. Legal recourse depends on the subscription agreement and applicable law.<\/td><\/tr><tr><td>Liquidity and maturity<\/td><td>Assets may not be immediately realizable. Fixed terms, settlement delays or permitted suspensions can restrict access to funds.<\/td><\/tr><tr><td>Currency and hedging<\/td><td>Non-USDT asset exposure, exchange movements, hedge mismatch or counterparty failure may affect realized USDT results. Hedging does not remove every risk.<\/td><\/tr><tr><td>USDT and market value<\/td><td>USDT can trade away from USD parity. Issuer terms, eligibility, liquidity or restrictions can affect transfers and redemption. [1]<\/td><\/tr><tr><td>Custody, operations and technology<\/td><td>Key loss, unauthorized access, fraud, record errors, outages or service-provider failure may affect assets and transactions.<\/td><\/tr><tr><td>Legal, tax and service changes<\/td><td>Applicable requirements or provider terms may change, affecting availability, costs, reporting and execution.<\/td><\/tr><\/tbody><\/table><\/div><h3>What is not represented<\/h3><p>No claim is made that a regulator, bank, card network or Tether has approved, insured or guaranteed GEX USDT Income. Internal account records do not establish independent custody, asset insurance or statutory deposit protection for an Income holding.<\/p><h3>Risk information is not exhaustive<\/h3><p>Customers should read the applicable asset-holding and subscription terms and obtain advice appropriate to their circumstances and should not rely solely on a calculator, promotional headline or on-chain record when deciding whether to subscribe.<\/p><p class=\"source-note\">[1] Tether, <a href=\"https://tether.to/en/legal/\" target=\"_blank\" rel=\"noopener noreferrer\">Token Terms of Sale and Service<\/a> and incorporated risk disclosures, reviewed 8 October 2026. These are third-party token terms, not the GEX product agreement and not evidence of a partnership.<\/p>"}, {"id": "documents", "number": "09", "title": "Agreements, support & document control", "intro": "Product information and transaction-specific terms are read together.", "body": "<p>This memorandum, version 1.0 dated 8 October 2026, describes the GEX USDT Income range. It is a product-information document, not an executed subscription agreement, a licence certificate or evidence that a transaction has been accepted.<\/p><h3>Your contract and records<\/h3><p>Before a commitment of funds, the customer receives the subscription agreement identifying the contracting entity, the investment entitlement, management and asset-holding terms, applicable fees, settlement arrangements, governing law and dispute process. The order confirmation then records the accepted amount, rate, term, start and maturity dates, and acknowledged document version. Browsing a webpage or using the calculator does not accept an order.<\/p><div class=\"table-scroll\"><table class=\"\"><thead><tr><th>Document<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>Investment Memorandum<\/td><td>Explains the product range, target rates, eligibility, fees, governance and principal risks.<\/td><\/tr><tr><td>Subscription agreement and asset-holding terms<\/td><td>Identify the legal parties, obligations, ownership arrangements and customer rights for the subscription.<\/td><\/tr><tr><td>Order confirmation and settlement statement<\/td><td>Record the specific transaction and its actual settlement outcome.<\/td><\/tr><tr><td>Wallet, exchange and card terms<\/td><td>Govern the separately selected services and their transaction quotes.<\/td><\/tr><\/tbody><\/table><\/div><h3>Language and changes<\/h3><p>English and Chinese versions share the same product parameters and version number. Any controlling-language provision is stated in the accepted agreement. A material discrepancy should be resolved before confirmation. Later website changes do not silently replace the terms of an accepted subscription; records retain the version supplied to the customer.<\/p><h3>Support and complaints<\/h3><p>Contact GEXFI at <a href=\"mailto:info@gexfi.com\">info@gexfi.com<\/a> or through the secure account channel. Quote the order reference and describe the issue. Never send passwords, private keys or complete card credentials. Complaints are directed to the responsible service provider under the accepted agreement; any applicable external dispute-resolution route is stated there.<\/p><h3>Institutional references<\/h3><p class=\"source-note\">[2] <em>Investment Memorandum 2025<\/em>, Silver Fern No.1 Fund, pp. 3–6: Eternova GP Limited and the documented governance framework. Used as historical institutional background, not as a transfer of the legacy fund’s mandate, assets or third-party appointments.<br>[3] New Zealand Companies Office, <a href=\"https://fsp-register.companiesoffice.govt.nz/about/the-role-of-the-fspr/\" target=\"_blank\" rel=\"noopener noreferrer\">The role of the Financial Service Providers Register<\/a> and <a href=\"https://fsp-register.companiesoffice.govt.nz/help-centre/managing-your-registration-as-a-fsp/keeping-fsp-details-up-to-date/\" target=\"_blank\" rel=\"noopener noreferrer\">Keeping FSP details up to date<\/a>, accessed 8 October 2026. Registration and licensing are distinct.<\/p>"}], "zh": [{"id": "overview", "number": "01", "title": "产品概览", "intro": "在 GEXFI 账户内，以 USDT 申购、记录收益并办理到期赎回的固定期限产品。", "body": "<p>GEX USDT Income 面向通过 GEXFI 购买 USDT、并希望在明确期限内配置部分余额的合格客户，提供 90 天、180 天及 365 天三档产品。申购金额、收益试算及赎回金额均以 USDT 计价。<\/p><p>产品将收益持仓与 GEXFI 钱包连接，并可在赎回后衔接符合条件的卡充值服务。收益持仓不属于钱包可用余额，不能直接用于卡消费。到期后先按赎回规则将应付金额结算至 GEXFI 钱包，再由客户安排转账、兑换或卡充值。<\/p><h3>产品要点<\/h3><div class=\"table-scroll\"><table class=\"\"><thead><tr><th>项目<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td>产品名称<\/td><td>GEX USDT Income<\/td><\/tr><tr><td>计价单位<\/td><td>USDT<\/td><\/tr><tr><td>持有期限<\/td><td>90、180 或 365 个自然日<\/td><\/tr><tr><td>目标年化收益率<\/td><td>分别为 3.80%、4.50% 和 5.00%<\/td><\/tr><tr><td>收益率口径<\/td><td>已反映产品管理费；不包含独立交易费用及个人税费<\/td><\/tr><tr><td>申购资金<\/td><td>符合条件的 GEXFI 购U资金<\/td><\/tr><tr><td>资金退出<\/td><td>固定期限，到期按最终赎回规则办理<\/td><\/tr><tr><td>最低申购金额<\/td><td>申购确认前展示适用的最低及最高金额<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\">目标收益不构成收益保证，实际应付金额可能低于试算结果，本金存在损失风险。本产品不是银行存款，也不是 Tether 发行的收益产品。<\/aside><h3>适用客户<\/h3><p>客户应能够在所选期限内持有相应资产，并理解投资及数字资产风险。不宜将应急资金或短期消费所需余额用于申购。实际参与资格取决于账户审核、产品开放情况及适用的服务限制。<\/p>"}, {"id": "terms", "number": "02", "title": "期限与目标收益", "intro": "同时查看目标年化收益率与完整持有期的收益试算，避免将年化收益理解为每期收益。", "body": "<div class=\"table-scroll\"><table class=\"rate-table\"><thead><tr><th>产品<\/th><th>期限<\/th><th>扣管理费后目标年化<\/th><th>完整持有期目标收益率<\/th><\/tr><\/thead><tbody><tr><td>USDT Income 90<\/td><td>90 天<\/td><td><b>3.80%<\/b><\/td><td>0.9370%<\/td><\/tr><tr><td>USDT Income 180<\/td><td>180 天<\/td><td><b>4.50%<\/b><\/td><td>2.2192%<\/td><\/tr><tr><td>USDT Income 365<\/td><td>365 天<\/td><td><b>5.00%<\/b><\/td><td>5.0000%<\/td><\/tr><\/tbody><\/table><\/div><p>收益率采用以 365 天为分母的单利年化口径，不属于包含复利假设的 APY。90 天产品的 3.80% 目标年化，不代表持有 90 天即可获得 3.80% 的收益。<\/p><h3>示例：申购 1,000 USDT 并持有完整期限<\/h3><div class=\"table-scroll\"><table class=\"\"><thead><tr><th>期限<\/th><th>目标收益<\/th><th>本金与目标收益合计<\/th><\/tr><\/thead><tbody><tr><td>90 天<\/td><td>9.37 USDT<\/td><td>1,009.37 USDT<\/td><\/tr><tr><td>180 天<\/td><td>22.19 USDT<\/td><td>1,022.19 USDT<\/td><\/tr><tr><td>365 天<\/td><td>50.00 USDT<\/td><td>1,050.00 USDT<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\">试算假设全部金额获接受、完整持有至到期且达到目标收益。显示金额保留两位小数，不代表实际业绩预测、已确认应付款项或最低申购金额。<\/aside><h3>申购确认信息<\/h3><p>申购确认载明产品名称、获接受金额、目标收益率、费用口径、起息日、到期日及适用文件版本。起息与到期时间记录在申购确认中。计算保留原始精度，试算页面显示至小数点后两位；结算单列明实际应付 USDT 金额及舍入调整。新产品展示的利率，不构成改变客户既有约定的依据。<\/p><h3>不默认自动续投<\/h3><p>产品到期不代表自动续投。后续续投须依据客户单独指令或明确授权，并适用新一期申购时的产品条款。<\/p>"}, {"id": "eligibility", "number": "03", "title": "参与资格与申购", "intro": "首期收益申购仅接受符合条件的 GEXFI 购U资金。", "body": "<p>持有 GEXFI 账户或钱包内收到 USDT，并不直接代表具备申购资格。客户须符合账户及产品适用的审核要求。首期暂不接受从外部钱包直接充值的 USDT 用于收益申购。<\/p><div class=\"table-scroll\"><table class=\"\"><thead><tr><th>资金来源或状态<\/th><th>首期处理方式<\/th><\/tr><\/thead><tbody><tr><td>符合条件的 GEXFI 购U资金<\/td><td>购U结算完成并通过资格核验后，可用于申购<\/td><\/tr><tr><td>外部钱包直接转入的 USDT<\/td><td>暂不用于收益申购<\/td><\/tr><tr><td>已为其他交易预留的余额<\/td><td>不可重复用于申购<\/td><\/tr><tr><td>尚未结算或待确认的购U金额<\/td><td>完成结算及必要审核后才可使用<\/td><\/tr><tr><td>Visa 卡内余额<\/td><td>不因卡与账户关联而自动成为申购资金<\/td><\/tr><\/tbody><\/table><\/div><h3>申购流程<\/h3><div class=\"steps\"><div class=\"step\"><span>01<\/span><div><h3>了解产品<\/h3><p>选择期限，阅读投资说明书及适用协议，核对目标收益与退出规则。<\/p><\/div><\/div><div class=\"step\"><span>02<\/span><div><h3>核对申购资金<\/h3><p>确认可用于申购的已结算可用金额。试算快捷金额不代表最低申购门槛。<\/p><\/div><\/div><div class=\"step\"><span>03<\/span><div><h3>提交申购指令<\/h3><p>确认金额及所需声明。提交指令不等于申购已获接受。<\/p><\/div><\/div><div class=\"step\"><span>04<\/span><div><h3>收到申购确认<\/h3><p>获接受的申购单独记为收益持仓，不再计入钱包可用资金。起息及到期信息以确认记录为准。<\/p><\/div><\/div><\/div><p>账户在客户确认指令前展示适用的申购限额及服务范围。仅已结算且符合条件的资金可以预留；指令在受理前被拒绝或取消时，解除资金预留，不形成收益持仓。账户限制或付款不匹配可能需要补充核验；确认起息前的期间不计入收益。<\/p>"}, {"id": "income-fees", "number": "04", "title": "收益计算与费用", "intro": "展示的目标年化收益率已反映 0.50%／年的产品管理费，不再重复扣减。", "body": "<div class=\"formula\">目标收益试算＝本金 × 扣管理费后目标年化 × 期限天数 ÷ 365<\/div><p>例如 1,000 USDT 申购 180 天产品：1,000 × 4.50% × 180 ÷ 365＝22.1917808 USDT，显示为 22.19 USDT。按日换算的目标收益仅为计提试算，不代表每日现金派付承诺。<\/p><h3>收益记录与结算<\/h3><p>持仓记录可展示目标计提金额及后续确认的收益，但须区分预计金额、已确认金额与已支付金额。收益曲线出现某一金额，不表示当日即可提取同额资金。结算单区分目标试算与实际结果，解释差额，并列明实际应付金额。收益依申购条款与到期持仓一并结算；每日记录不是独立的每日派付。<\/p><div class=\"table-scroll\"><table class=\"\"><thead><tr><th>费用或成本<\/th><th>展示及处理方式<\/th><\/tr><\/thead><tbody><tr><td>产品管理费<\/td><td>0.50%／年，已反映在展示的净目标年化中，不从所示净目标收益再扣一次。<\/td><\/tr><tr><td>购U与兑换服务<\/td><td>成交报价可能包含汇率加价；客户确认前可核对实际支付及预计净到账金额。<\/td><\/tr><tr><td>卡充值与卡使用<\/td><td>属于独立服务，适用费用与预计入账金额依交易报价或卡条款展示。<\/td><\/tr><tr><td>链上转账<\/td><td>申请链上提币时可能产生网络费或转账费用。<\/td><\/tr><tr><td>税费<\/td><td>所示目标收益率未包含客户个人税务影响。<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"note\">“净目标年化”指已反映所列产品管理费，不代表已扣除所有购U、兑换、转账、卡服务或个人税费。本产品不以“零费用”作出宣传。<\/aside><p>申购确认前提供的费用表载明管理费计提基础、收取时点及收取主体。展示的净目标收益不再额外扣除一次 0.50% 管理费。独立服务收费通过相应报价披露，不以另一笔管理费名义隐含扣收。内部交易成本和商业利润不计作向客户支付的投资收益。<\/p>"}, {"id": "management", "number": "05", "title": "管理、治理与资产持有", "intro": "治理流程与法律责任分别明确，客户权益由适用申购文件载明。", "body": "<h3>Eternova 机构背景<\/h3><p>本产品治理设计参考 Silver Fern No.1 Fund《Investment Memorandum 2025》所载框架。该文件将 Eternova GP Limited 列为普通合伙人（GP），记载金融服务提供商参考号 FSP554706，职责包括日常运营、合规监督及受托职责。其治理框架包括投资委员会、风险委员会、非执行监督及决策留档。[2]<\/p><p>上述内容为机构背景，不表示 Silver Fern No.1 Fund 是 GEX USDT Income 的发行人或保证人。原基金资产、投资者权益与第三方委任不会因本说明书而转移。FSP 登记参考本身不等同于金融服务牌照或产品批准。[3]<\/p><div class=\"table-scroll\"><table class=\"\"><thead><tr><th>职能<\/th><th>在本产品中的职责<\/th><\/tr><\/thead><tbody><tr><td>GEXFI 客户界面<\/td><td>提供产品信息、账户访问、申购记录、报表，以及钱包与卡服务的连接。<\/td><\/tr><tr><td>发行与签约主体<\/td><td>申购协议具名的法律主体承担协议载明的义务；客户在资金承诺前取得其法定名称及自身请求权性质。<\/td><\/tr><tr><td>投资管理<\/td><td>申购文件载明的管理人依其授权管理资产配置、风险限额及收益结算。<\/td><\/tr><tr><td>资产持有与保管<\/td><td>资产持有条款载明实际账户持有人、保管安排及客户权益。接受存款的银行不因此自动成为独立托管人。<\/td><\/tr><\/tbody><\/table><\/div><h3>投资与运营控制<\/h3><p>控制框架区分投资审批、资金执行、财务核对与风险复核，并设置决策记录、关联方利益冲突审查及差异升级处理。内部监督不同于另行签约的审计、受托或法定监督服务。<\/p><h3>资产配置与客户权益<\/h3><p>USDT 为产品计价单位，并不代表全部资产始终以 USDT 持有。资产策略采用法币银行存款及现金流动性安排，货币兑换与对冲纳入内部资金管理。资产持有条款说明法律归属、隔离方式、控制权及破产时的处理；客户账本记录本身不等于信托权益、担保权或独立托管证明。<\/p>"}, {"id": "maturity", "number": "06", "title": "到期与赎回", "intro": "到期后依条款结算赎回，不等于随时可提的钱包余额。", "body": "<p>90 天、180 天及 365 天产品均按所选自然日期限持有，首期不设活期。已接受的申购确认记录起息日期、到期日期及适用赎回指令。<\/p><div class=\"steps\"><div class=\"step\"><span>01<\/span><div><h3>达到到期日<\/h3><p>持仓进入到期结算流程。持有期限届满，本身不等于钱包已有可用资金。<\/p><\/div><\/div><div class=\"step\"><span>02<\/span><div><h3>确认收益与应付款<\/h3><p>结算单记录本金、实际收益、适用的已披露扣项及净赎回金额。<\/p><\/div><\/div><div class=\"step\"><span>03<\/span><div><h3>钱包完成入账<\/h3><p>结算及必要核验完成后，将应付 USDT 记入 GEXFI 钱包。“处理中”不等于已入账。<\/p><\/div><\/div><div class=\"step\"><span>04<\/span><div><h3>安排使用或再次申购<\/h3><p>实际入账后，客户选择可用的钱包、转账或卡服务。再次申购须取得新的受理确认。<\/p><\/div><\/div><\/div><h3>结算时效<\/h3><p>订单适用的处理时效及工作日规则在确认前提供，并随订单留存。账户展示预计结算日期与处理进度。到期不等于 T+0 付款；钱包内部入账也不代表银行或卡账户已同时入账。<\/p><h3>提前退出与取消<\/h3><p>申购指令仅在受理前且账户允许时可取消。已接受的定期持仓不开放常规提前支取。法律允许或协议接受的例外退出单独处理；对应收益调整及已披露费用须经客户确认。本产品不承诺二级市场买方或平台回购。<\/p><h3>延迟、失败与续投<\/h3><p>必要核验、账户限制、争议指令或执行失败可能中断结算。客户记录保留相关金额、原因与状态，直至问题解决；失败交易不得标记为完成。通知按适用协议执行。不默认自动续投，再次申购须有新的指令或明确授权，并提前展示新期限及新利率。<\/p>"}, {"id": "records-card", "number": "07", "title": "钱包、卡与数字凭证", "intro": "服务相互连接，余额分别记录，每一步均有独立交易依据。", "body": "<h3>先赎回钱包，再选择卡充值<\/h3><p>赎回结算完成后，资金回到 GEXFI 钱包。卡充值是可选的独立交易，客户无须通过充值卡片才能取得钱包赎回款。卡服务开放、限额及使用范围以相关卡项目为准。<\/p><p>客户确认卡充值前，应查看付款资产、成交汇率、适用费用、预计卡内入账金额、报价有效期及处理条件。USDT 收益持仓不会自动成为以美元计价的卡余额，也不预设 USDT 与 USD 始终按 1:1 兑换。<\/p><div class=\"table-scroll\"><table class=\"\"><thead><tr><th>记录<\/th><th>所证明的信息<\/th><\/tr><\/thead><tbody><tr><td>申购确认<\/td><td>获接受的订单、金额、期限、起止日期及适用文件版本<\/td><\/tr><tr><td>收益记录<\/td><td>预计收益、已确认分配与已支付金额的区分<\/td><\/tr><tr><td>赎回记录<\/td><td>申请、处理进度及实际结算结果<\/td><\/tr><tr><td>钱包／卡交易<\/td><td>实际完成的独立转账、兑换或卡入账<\/td><\/tr><tr><td>链上凭证（如已实现）<\/td><td>指定网络上的对应交易及其确认情况<\/td><\/tr><\/tbody><\/table><\/div><h3>链上记录的边界<\/h3><p>如提供链上记录，应载明网络、交易哈希、记录类别及确认状态。单一凭证不能独立证明全部底层资产的所有权、发行人的偿付能力或投资价值获得保证。<\/p><aside class=\"note\">数字凭证本身不创设可交易投资代币、自由转让权或二级市场。验证链接应对应指定网络上的真实记录，示例哈希不构成已发生交易的证明。<\/aside><h3>安全与记录更正<\/h3><p>客户应通过账户核实操作指令，并及时反映记录差异。记录更正应保留原交易轨迹并说明变更原因。公开链上记录不能替代投资协议。<\/p>"}, {"id": "risks", "number": "08", "title": "主要风险", "intro": "评估目标收益的同时，应了解可能的损失及资金使用限制。", "body": "<div class=\"table-scroll\"><table class=\"\"><thead><tr><th>风险<\/th><th>可能对客户产生的影响<\/th><\/tr><\/thead><tbody><tr><td>本金与业绩<\/td><td>目标收益可能无法实现；损失可能减少收益或本金。目标收益率不等于保证付款承诺。<\/td><\/tr><tr><td>发行人与交易对手<\/td><td>发行人、银行、执行机构或其他交易对手发生问题，可能导致延迟或损失。法律救济取决于申购协议及适用法律。<\/td><\/tr><tr><td>流动性与到期<\/td><td>资产未必能立即变现；固定期限、结算延迟或约定的暂停安排可能限制资金使用。<\/td><\/tr><tr><td>货币与对冲<\/td><td>非 USDT 资产敞口、汇率变化、对冲不匹配或对手方违约，可能影响实际 USDT 结果。对冲不消除全部风险。<\/td><\/tr><tr><td>USDT 与市值<\/td><td>USDT 市价可能偏离美元平价；发行条款、资格限制、流动性或其他限制可能影响转账与赎回。[1]<\/td><\/tr><tr><td>托管、运营与技术<\/td><td>密钥丢失、未授权操作、欺诈、记录错误、系统中断或服务机构故障，可能影响资产及交易。<\/td><\/tr><tr><td>法律、税务与服务变化<\/td><td>适用要求或服务条款变化，可能影响可用性、费用、申报及交易执行。<\/td><\/tr><\/tbody><\/table><\/div><h3>不作出的保证<\/h3><p>本文件不表示任何监管机构、银行、卡组织或 Tether 已批准、承保或保证 GEX USDT Income。内部账户记录不因此建立独立托管、资产保险或收益持仓的法定存款保障。<\/p><h3>风险并非穷尽列举<\/h3><p>客户应阅读适用的资产持有与申购条款，并结合自身情况获取适当意见，不应仅凭收益试算、宣传标题或链上记录决定申购。<\/p><p class=\"source-note\">[1] Tether《<a href=\"https://tether.to/en/legal/\" target=\"_blank\" rel=\"noopener noreferrer\">Token Terms of Sale and Service<\/a>》及其纳入的风险披露，查阅日期为 2026 年 10 月 8 日。该资料为第三方代币条款，不是 GEX 产品协议，也不代表双方存在合作背书。<\/p>"}, {"id": "documents", "number": "09", "title": "协议、客服与文件管理", "intro": "产品说明与每笔交易适用的合同条款一并阅读。", "body": "<p>本说明书版本为 1.0，日期为 2026 年 10 月 8 日，用于说明 GEX USDT Income 产品。它是产品信息文件，不是已签署的申购协议、牌照证明或交易已被接受的凭据。<\/p><h3>合同与交易记录<\/h3><p>客户作出资金承诺前，取得载明签约主体、投资权益、管理与资产持有安排、适用费用、结算条件、适用法律及争议处理的申购协议。订单确认随后记录已接受金额、收益率、期限、起息及到期日期，以及客户确认的文件版本。浏览网页或使用试算器不构成订单受理。<\/p><div class=\"table-scroll\"><table class=\"\"><thead><tr><th>文件<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td>投资说明书<\/td><td>说明产品范围、目标收益、申购资格、费用、治理及主要风险。<\/td><\/tr><tr><td>申购协议与资产持有条款<\/td><td>载明该笔申购的法律主体、义务、资产归属安排及客户权益。<\/td><\/tr><tr><td>订单确认与结算单<\/td><td>记录具体交易及其实际结算结果。<\/td><\/tr><tr><td>钱包、兑换与卡服务条款<\/td><td>适用于客户另行选择的服务及对应交易报价。<\/td><\/tr><\/tbody><\/table><\/div><h3>语言与版本变更<\/h3><p>英文与中文版本采用相同产品参数和版本号。优先语言条款由客户接受的协议载明；重大文字差异应在确认前解决。后续官网变更不自动替换已接受申购的条款，交易记录保留向客户提供的文件版本。<\/p><h3>客服与投诉<\/h3><p>请通过 <a href=\"mailto:info@gexfi.com\">info@gexfi.com<\/a> 或账户内安全渠道联系 GEXFI，并提供订单编号及问题描述。不要发送密码、私钥或完整卡凭据。投诉依已接受的协议转交对应服务主体处理；适用的外部争议处理途径以协议载明信息为准。<\/p><h3>机构参考资料<\/h3><p class=\"source-note\">[2] Silver Fern No.1 Fund《Investment Memorandum 2025》第 3–6 页：Eternova GP Limited 及其治理框架。该资料用于说明历史机构背景，不转移原基金的授权、资产或第三方委任。<br>[3] 新西兰 Companies Office《<a href=\"https://fsp-register.companiesoffice.govt.nz/about/the-role-of-the-fspr/\" target=\"_blank\" rel=\"noopener noreferrer\">The role of the Financial Service Providers Register<\/a>》及《<a href=\"https://fsp-register.companiesoffice.govt.nz/help-centre/managing-your-registration-as-a-fsp/keeping-fsp-details-up-to-date/\" target=\"_blank\" rel=\"noopener noreferrer\">Keeping FSP details up to date<\/a>》，查阅日期为 2026 年 10 月 8 日。登记与服务牌照分属不同事项。<\/p>"}]}, "sources": [{"id": 2, "title": "Investment Memorandum 2025", "pages": "3–6", "use": "Historical Eternova GP Limited governance background; not a current appointment or licence assertion."}, {"id": 3, "title": "New Zealand Companies Office FSPR role and registration guidance", "url": "https://fsp-register.companiesoffice.govt.nz/about/the-role-of-the-fspr/", "accessed": "2026-10-08"}]}, "images": {"me-top": "assets/me-top.webp", "me-wallet": "assets/me-wallet.webp", "exchange": "assets/exchange.webp", "home-top": "assets/home-top.webp", "home-bottom": "assets/home-bottom.webp", "more": "assets/more.webp", "me-middle": "assets/me-middle.webp"}, "pdfs": {"zh": "documents/GEX_USDT_Income_Investment_Memorandum_ZH_v1.0.pdf", "en": "documents/GEX_USDT_Income_Investment_Memorandum_EN_v1.0.pdf"}, "qr": "assets/checkout-demo-qr.png"};</script><script>/* GEXFI H5 Income — interaction prototype. No production APIs or real funds. */
(()=>{'use strict';
const D=window.GXI_DATA, K='gexfi-income-h5-demo-v2', SCALE=1e6, DAY=86400000;
const products=[{days:90,rate:.038},{days:180,rate:.045},{days:365,rate:.05}];
const requestedLanguage=new URLSearchParams(location.search).get('lang');
let lang=['zh','en'].includes(requestedLanguage)?requestedLanguage:(localStorageSafe('get','gxi-lang')||'zh'), state, route='', amount=1000, chosen=180, range=30, holdingsFilter='all', activityFilter='all', consent={memo:false,risk:false}, quote=null, toastTimer, fundingMode='wallet', buyQuote=null, buyConsent=false, selectedPurchaseId=null;
function localStorageSafe(mode,key,value){try{if(mode==='get')return localStorage.getItem(key);localStorage.setItem(key,value)}catch(_){return null}}
const t=(zh,en)=>lang==='zh'?zh:en, esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function num(v,d=2){return Number(v||0).toLocaleString(lang==='zh'?'zh-CN':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
const micro=v=>Math.round(Number(v)*SCALE), money=(m,d=2)=>num(Number(m||0)/SCALE,d), pBy=d=>products.find(p=>p.days===Number(d))||products[1];
const dayAdd=(date,n)=>new Date(Date.parse(date+'T00:00:00Z')+n*DAY).toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.floor((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/DAY);
function businessAdd(date,n){let d=date;while(n>0){d=dayAdd(d,1);if(![0,6].includes(new Date(d+'T00:00:00Z').getUTCDay()))n--;}return d}
function fmtdate(d){if(!d)return'—';return lang==='zh'?d.replaceAll('-',' / '):new Intl.DateTimeFormat('en',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(d+'T00:00:00Z'))}
const signedMoney=(n,d=2)=>(n>0?'+':'')+money(n,d);
const rate=d=>(pBy(d).rate*100).toFixed(2), calc=(principal,d,days=d)=>Math.round(principal*pBy(d).rate*days/365);
function seed(empty=false){const now='2026-10-09';return{schema:2,fiatOrders:[],demoRegion:'DEMO',now,verified:true,restriction:null,funds:{eligible:micro(empty?2500:9000),external:micro(3000),returned:0,reserved:0,pending:micro(500)},cardUSD:0,orders:[],cardOrders:[],positions:empty?[]:[{id:'IN-261009-001',days:180,principal:micro(2000),start:'2026-09-03',end:dayAdd('2026-09-03',180),status:'active',rate:.045,memo:'1.0',autoRenew:false},{id:'IN-261009-002',days:365,principal:micro(3000),start:'2026-07-09',end:dayAdd('2026-07-09',365),status:'active',rate:.05,memo:'1.0',autoRenew:false},{id:'IN-261009-003',days:90,principal:micro(1000),start:dayAdd(now,-90),end:now,status:'matured',rate:.038,memo:'1.0',autoRenew:false}],events:[],seq:100}}
function load(){try{let a=JSON.parse(localStorageSafe('get',K));return a?.schema===2?a:seed()}catch(_){return seed()}}
function save(){localStorageSafe('set',K,JSON.stringify(state))}
function id(prefix){state.seq++;return prefix+'-261009-'+state.seq}
function position(id){return state.positions.find(x=>x.id===id)}
function available(){return state.funds.eligible+state.funds.external+state.funds.returned}
function elapsed(p){return Math.min(p.days,Math.max(0,daysBetween(p.start,state.now)))}
function estimate(p){return Math.round(p.principal*p.rate*elapsed(p)/365)}
function holdTotal(){return state.positions.filter(p=>p.status!=='redeemed').reduce((n,p)=>n+p.principal,0)}
function estimateTotal(){return state.positions.filter(p=>p.status!=='redeemed').reduce((n,p)=>n+estimate(p),0)}
function paidTotal(){return state.positions.filter(p=>p.status==='redeemed').reduce((n,p)=>n+(p.actualIncome||0),0)}

ide account-specific agreements and settlement terms.'))}</main>`+dock(t('确认模拟申购','Confirm demo subscription'),'submit','id="confirm-subscribe" '+(!(consent.memo&&consent.risk)?'disabled':''))}
function orderPage(orderId){const o=state.orders.find(o=>o.id===orderId);if(!o)return productsPage();const pending=o.status==='pending';return header(t('申购记录','Subscription record'),'holdings')+`<main class="page"><div class="result-hero"><div class="result-icon ${pending?'pending':o.status==='accepted'?'':'failed'}">${I(pending?'clock':o.status==='accepted'?'check':'info',27)}</div><h1>${statusLabel(o.status)}</h1><p class="subtle">${pending?t('金额已预留，等待受理确认。','Funds reserved. Awaiting acceptance.'):o.status==='accepted'?t('已建立持仓，按受理确认开始计算持有期。','Your holding has been created under its acceptance terms.'):t('本次指令未建立持仓，预留金额已释放。','No holding was created. The reservation has been released.')}</p><div class="large-number">${money(o.principal)}<small>USDT</small></div></div><div class="card">${def(t('订单编号','Order ID'),o.id)}${def(t('产品','Product'),`USDT Income ${o.days}`)}${def(t('目标年化','Net target p.a.'),rate(o.days)+'%')}${def(t('提交日期','Submitted'),fmtdate(o.created))}${def(t('资金状态','Funds status'),pending?t('预留中，不可重复使用','Reserved; unavailable elsewhere'):o.status==='accepted'?t('已计入收益持仓','Included in Income holdings'):t('已释放至可用余额','Released to available funds'))}</div><div class="spacer"></div>${pending?`${notice(t('等待服务端受理。可通过右上角演示控制模拟“受理”“拒绝”；生产页面不显示这些控制。','Waiting for server acceptance. Demo controls can simulate acceptance or rejection; these controls do not appear in production.'))}<div class="spacer"></div>${btn(t('取消未受理申购','Cancel pending subscription'),'cancel-order','secondary',`data-id="${o.id}"`)}`:o.status==='accepted'?goBtn(t('查看持仓','View holding'),'holding/'+o.positionId):goBtn(t('返回产品','Back to products'),'products')}<div class="spacer-sm"></div>${goBtn(t('查看全部记录','View all activity'),'activity','secondary')}</main>`}
function holdingCard(p){return`<button class="term-card" data-go="holding/${p.id}"><div class="row">${productLine(p.days)}${pill(statusLabel(p.status),p.status==='active'?'':p.status==='redeemed'?'green':'amber')}</div><div class="row" style="margin:17px 0 8px"><div><span class="caption">${t('持仓本金','Principal')}</span><div style="font-size:24px;letter-spacing:-.5px;margin-top:5px">${money(p.principal)} <small style="font-size:10px">USDT</small></div></div>${I('chevron',16)}</div><div class="term-foot"><span>${fmtdate(p.end)} ${t('到期','maturity')}</span><b class="green">${p.status==='redeemed'?t('实际收益 ','Actual income '):t('预计收益 ','Estimated ')}${signedMoney(p.status==='redeemed'?p.actualIncome:estimate(p))}</b></div></button>`}
function holdingsPage(){const filtered=state.positions.filter(p=>holdingsFilter==='all'||(holdingsFilter==='active'?p.status==='active':holdingsFilter==='matured'?['matured','redeeming','redeem_failed'].includes(p.status):p.status==='redeemed'));return header(t('我的收益资产','My Income holdings'),'products')+`<main class="page"><div class="card"><div class="row"><span class="caption">${t('持仓本金','Holding principal')}</span>${pill('USDT')}</div><div class="large-number" style="margin-top:10px">${money(holdTotal())}</div><div class="stat-pair"><div><span>${t('累计预计收益','Estimated accrued income')}</span><strong class="green">+${money(estimateTotal())}</strong></div><div><span>${t('累计已结算收益','Total settled income')}</span><strong>${money(paidTotal())}</strong></div></div><div class="spacer"></div>${link(t('查看资金与收益记录','View activity & income'),'activity')}</div><div class="section-line"><h2>${t('持仓明细','Your holdings')}</h2>${link(t('继续申购','Subscribe'),'products')}</div><div class="tab-filters">${[['all',t('全部','All')],['active',t('持有中','Active')],['matured',t('到期 / 结算','Maturity')],['redeemed',t('已赎回','Redeemed')]].map(([v,l])=>btn(l,'hold-filter',v===holdingsFilter?'active':'',`data-value="${v}"`)).join('')}</div>${state.orders.filter(o=>o.status==='pending').map(o=>`<div class="card tight"><button class="list-item" data-go="order/${o.id}"><div><span class="list-title">${t('申购待受理','Subscription pending')}</span><p>USDT Income ${o.days} · ${money(o.principal)} USDT</p></div>${I('clock',18)}</button></div><div class="spacer-sm"></div>`).join('')}${filtered.length?filtered.map(holdingCard).join(''):`<div class="card empty">${I('income',33)}<h3>${t('暂无该类持仓','No holdings in this category')}</h3><p>${t('选择合适的固定期限，完成首次申购。','Choose a defined term to start your first subscription.')}</p>${goBtn(t('查看产品','Explore products'),'products','secondary')}</div>`}<p class="footnote">${t('持仓本金与预留金额不属于钱包可用余额；预计收益尚未入账，不计入可消费资金。','Holding principal and reserved funds are not available wallet cash. Estimated income is not credited or spendable.')}</p></main>`}
function chart(p){const n=Math.min(range||p.days,Math.max(1,elapsed(p))), first=Math.max(0,elapsed(p)-n), max=Math.max(1,estimate(p)/SCALE), pts=[];for(let i=0;i<=12;i++){const days=first+n*i/12;pts.push([8+i*25,129-((p.principal/SCALE*p.rate*days/365)/max)*106])}return`<svg class="graph" viewBox="0 0 320 150" role="img" aria-label="${t('按目标收益率计算的预计累计收益线，非历史业绩','Illustrative cumulative target accrual, not historical performance')}"><path d="M8 25H309M8 77H309M8 129H309" stroke="#e7edf2"/><path d="M${pts.map(p=>p.join(',')).join('L')}L308,129L8,129Z" fill="#eaf0f6"/><path d="M${pts.map(p=>p.join(',')).join('L')}" stroke="#6488aa" stroke-width="2" fill="none"/><circle cx="308" cy="${pts[pts.length-1][1]}" r="3" fill="#456e95"/><text x="8" y="146">${dayAdd(p.start,first).slice(5)}</text><text x="276" y="146">${dayAdd(p.start,elapsed(p)).slice(5)}</text></svg>`}
function holdingPage(pid){const p=position(pid);if(!p)return holdingsPage();return header(t('持仓详情','Holding details'),'holdings')+`<main class="page"><div class="card"><div class="row">${productLine(p.days)}${pill(statusLabel(p.status),p.status==='active'?'':'amber')}</div><div class="label" style="margin-top:21px">${t('持仓本金','Principal')}</div><div class="large-number">${money(p.principal)}<small>USDT</small></div><div class="stat-pair"><div><span>${p.status==='redeemed'?t('实际结算收益','Actual settled income'):t('累计预计收益','Estimated accrued income')}</span><strong class="${p.status==='redeemed'&&p.actualIncome<0?'danger':'green'}">${signedMoney(p.status==='redeemed'?p.actualIncome:estimate(p))}</strong></div><div><span>${t('预计每日收益','Illustrative daily accrual')}</span><strong style="font-size:17px">${money(Math.round(p.principal*p.rate/365),6)}</strong></div></div><div class="progress"><span style="width:${Math.min(100,elapsed(p)/p.days*100)}%"></span></div><div class="row caption"><span>${fmtdate(p.start)}</span><span>${t('已持有','Held')} ${elapsed(p)} / ${p.days} ${t('天','days')}</span></div></div><div class="card mt">${def(t('到期日','Maturity'),fmtdate(p.end))}${def(t('目标年化（扣管理费后）','Net target p.a.'),(p.rate*100).toFixed(2)+'%')}${def(t('实际收益确认','Actual income confirmation'),p.status==='redeemed'?money(p.actualIncome)+' USDT':t('结算时确认','Confirmed at settlement'))}${def(t('到期安排','Maturity instruction'),t('结算回钱包，不自动续投','Settle to wallet; no auto-renewal'))}<div class="spacer-sm"></div>${p.status==='active'?goBtn(t('查看到期安排','Maturity instructions'),'maturity/'+p.id,'secondary'):p.status==='matured'?goBtn(t('申请到期结算','Request maturity settlement'),'redeem/'+p.id):['redeeming','redeem_failed'].includes(p.status)?goBtn(t('查看结算进度','Track settlement'),'settlement/'+p.id):goBtn(t('查看钱包入账','View wallet credit'),'settlement/'+p.id)}</div><div class="section-line"><h2>${t('预计收益趋势','Illustrative accrual')}</h2>${link(t('每日明细','Daily records'),'income/'+p.id)}</div><div class="card"><div class="tabs compact">${[7,30,90,0].map(r=>btn(r?r+t('天','d'):t('全部','All'),'range',range===r?'active':'',`data-value="${r}"`)).join('')}</div>${chart(p)}<div class="caption">${t('依据目标年化计算的示意计提线，不是实际投资业绩或已支付收益。','Calculated using the target rate; not actual investment performance or paid income.')}</div></div><div class="card mt tight"><button class="list-item" data-go="receipt/${p.id}"><div class="row start">${I('file',18)}<span>${t('申购确认与数字凭证','Confirmation & digital record')}</span></div>${I('chevron',14)}</button><button class="list-item" data-go="chain/${p.id}"><div class="row start">${I('chain',18)}<span>${t('链上记录状态','On-chain record status')}</span></div>${I('chevron',14)}</button><button class="list-item" data-go="early/${p.id}"><span>${t('提前退出规则','Early-exit rules')}</span>${I('chevron',14)}</button><button class="list-item" data-go="activity"><span>${t('资金活动记录','Account activity')}</span>${I('chevron',14)}</button></div></main>`}
function dailyPage(pid){const p=position(pid);if(!p)return holdingsPage();let n=Math.min(range||365,elapsed(p));let entries=[];for(let i=0;i<n;i++){const d=elapsed(p)-i;entries.push(`<div class="list-item"><div><span class="list-title">${fmtdate(dayAdd(p.start,d))}</span><p>${t('预计计提 · 未派付','Estimated accrual · not paid')}</p></div><div class="right"><strong class="green">+${money(Math.round(p.principal*p.rate/365),6)}</strong><small>USDT</small></div></div>`)}return header(t('每日收益明细','Daily income records'),'holding/'+p.id)+`<main class="page"><div class="card"><div class="row"><span class="caption">${t('累计预计收益','Estimated accrued income')}</span>${link(t('导出','Export'),'export/'+p.id)}</div><div class="large-number green" style="margin:10px 0">+${money(estimate(p))}<small>USDT</small></div>${def(t('已确认收益','Confirmed income'),p.status==='redeemed'?money(p.actualIncome):t('结算时确认','At settlement'))}${def(t('已入账收益','Credited income'),p.status==='redeemed'?money(p.actualIncome):'0.00')}</div><div class="tabs">${[7,30,90,0].map(r=>btn(r?r+t('天','d'):t('全部','All'),'range',range===r?'active':'',`data-value="${r}"`)).join('')}</div><div class="card tight">${entries.join('')||`<div class="empty">${t('尚未开始计提','Accrual has not started')}</div>`}</div></main>`}
function receiptPage(pid){const p=position(pid);if(!p)return holdingsPage();return header(t('申购确认','Subscription confirmation'),'holding/'+p.id)+`<main class="page"><div class="badge-line"><span class="eyebrow" style="margin:0">GEXFI / INCOME</span>${pill(t('演示记录','Demo record'))}</div><div class="card">${productLine(p.days)}<div class="spacer"></div>${def(t('确认编号','Confirmation ID'),p.id)}${def(t('申购本金','Principal'),money(p.principal)+' USDT')}${def(t('产品期限','Term'),p.days+t(' 个自然日',' calendar days'))}${def(t('目标年化','Net target p.a.'),(p.rate*100).toFixed(2)+'%')}${def(t('管理费口径','Management fee'),t('已反映，不重复扣除','Reflected; not charged again'))}${def(t('起息日期','Start date'),fmtdate(p.start))}${def(t('到期日期','Maturity'),fmtdate(p.end))}${def(t('计息规则','Day count'),'ACT/365 · '+t('单利','simple interest'))}${def(t('资金来源','Funding source'),t('已结算合资格 GEXFI 购U资金','Settled eligible GEXFI-purchased USDT'))}${def(t('说明书版本','Memorandum version'),'1.0 · 2026-10-08')}${def(t('续投指令','Renewal mandate'),t('未授权','Not authorized'))}${def(t('链上凭证','On-chain record'),t('未生成','Not issued'))}</div><div class="spacer"></div>${notice(t('本地演示确认单不构成真实受理或法律合同。生产确认单须记录实际签约主体、申购协议版本、受理时间与服务端签名。','A local demo record is not an accepted contract. Production confirmations must retain the actual counterparty, agreement version, acceptance timestamp and server reference.'))}<div class="button-pair">${btn(t('下载确认记录','Download record'),'download-receipt','secondary',`data-id="${p.id}"`)}${goBtn(t('查看说明书','Memorandum'),'memo','secondary')}</div></main>`}
function chainPage(pid){const p=position(pid);return header(t('链上记录','On-chain records'),p?'holding/'+p.id:'holdings')+`<main class="page"><div class="card empty">${I('chain',35)}<h3>${t('尚无可验证的链上记录','No verifiable on-chain record')}</h3><p>${t('当前显示的是收益账户内的申购记录，\n并非已发行的链上 Token。','The current confirmation is an account record,\nnot an issued on-chain token.').replace('\n','<br>')}</p>${pill(t('未生成 · 不显示模拟哈希','Not issued · no mock transaction hash'))}</div><div class="card mt">${def(t('对应持仓','Holding'),p?.id||'—')}${def(t('网络','Network'),'—')}${def(t('交易哈希','Transaction hash'),'—')}${def(t('链上确认状态','Confirmation status'),t('无真实交易记录','No actual transaction'))}</div><div class="spacer"></div>${notice(t('仅在真实网络、交易哈希及确认状态均可验证时开放浏览器验证入口。内部凭证不证明底层资产所有权、保本或自由转让权。','An explorer link is enabled only for an actual network, transaction hash and confirmation status. An internal record does not establish asset ownership, capital protection or transferability.'))}</main>`}
function maturityPage(pid){const p=position(pid);if(!p)return holdingsPage();return header(t('到期安排','Maturity instructions'),'holding/'+p.id)+`<main class="page"><div class="card">${productLine(p.days)}<div class="spacer"></div>${def(t('到期日','Maturity'),fmtdate(p.end))}${def(t('剩余天数','Days remaining'),Math.max(0,daysBetween(state.now,p.end))+t(' 天',' days'))}${def(t('到期本金','Principal at maturity'),money(p.principal)+' USDT')}${def(t('预计持满期限收益','Illustrative full-term income'),money(calc(p.principal,p.days))+' USDT')}</div><div class="section-line"><h2>${t('当前安排','Current instruction')}</h2></div><div class="card"><div class="row"><span class="list-icon">${I('wallet')}</span><div style="flex:1"><h3>${t('到期结算至 GEXFI 钱包','Settle to GEXFI Wallet')}</h3><div class="caption">${t('不自动转卡，不默认续投','No automatic card funding or renewal')}</div></div>${I('check',18)}</div></div><div class="card mt"><h3>${t('需要再次申购？','Planning to reinvest?')}</h3><p class="subtle">${t('结算入账后，重新核验资金资格并选择当时可用产品。新订单重新确认利率、期限与文件版本。','After settlement, eligibility is checked again and a new product is selected. A new order confirms the rate, term and document version.')}</p>${link(t('浏览当前产品','Browse current products'),'products')}</div><div class="spacer"></div>${notice(t('到期日并不等于即时可用。预计结算日期及处理状态随订单显示；本演示使用到期后 2 个工作日作为流程样例。','Maturity is not instant availability. Timing is retained with each order. This demo illustrates two business days after maturity.'))}<div class="spacer"></div>${p.status==='matured'?goBtn(t('申请到期结算','Request maturity settlement'),'redeem/'+p.id):goBtn(t('返回持仓','Back to holding'),'holding/'+p.id,'secondary')}</main>`}
function earlyPage(pid){const p=position(pid);return header(t('提前退出规则','Early-exit rules'),p?'holding/'+p.id:'rules')+`<main class="page"><div class="card"><div class="row start"><span class="list-icon">${I('lock',22)}</span><h3>${t('固定期限内不提供常规提前赎回','Ordinary early redemption is unavailable')}</h3></div><p class="subtle">${t('已受理的 90 天、180 天及 365 天持仓按约定期限持有。提交申请不意味着可立即取回资金。','Accepted 90-, 180- and 365-day holdings run for their agreed term. Sending a request does not create a right to immediate withdrawal.')}</p></div><div class="card mt"><h3>${t('两种情形分别处理','Two separate circumstances')}</h3>${def(t('申购尚未受理','Before acceptance'),t('可申请取消，成功后释放预留','Cancellation may release reserved funds'))}${def(t('持仓已受理','After acceptance'),t('按例外退出条款单独处理','Exceptional exit terms apply separately'))}<p class="caption">${t('法律或协议允许的例外事项通过客服处理。收益调整及费用须在客户确认前说明；不承诺回购或二级市场买方。','Exceptions permitted by the agreement or applicable requirements are handled by support. Any adjustments and fees are explained before acceptance; no buyback or secondary buyer is promised.')}</p></div><div class="spacer"></div>${goBtn(t('联系客户服务','Contact support'),'support','secondary')}</main>`}
function redemptionPage(pid){const p=position(pid);if(!p)return holdingsPage();if(!['matured','redeem_failed'].includes(p.status))return maturityPage(p.id);return header(t('到期结算申请','Maturity settlement request'),'holding/'+p.id)+`<main class="page has-dock"><div class="card">${productLine(p.days)}<div class="spacer"></div>${def(t('本金','Principal'),money(p.principal)+' USDT')}${def(t('预计收益（非最终应付款）','Illustrative income, not final payable'),money(calc(p.principal,p.days))+' USDT')}${def(t('预计本息合计','Illustrative total'),`<strong>${money(p.principal+calc(p.principal,p.days))} USDT</strong>`)}${def(t('收款账户','Destination'),'GEXFI Wallet · USDT')}${def(t('额外赎回费用','Separate redemption fee'),t('以适用订单条款为准','Per accepted order terms'))}${def(t('当前产品管理费','Product management fee'),t('已反映，不重复扣除','Already reflected; not charged again'))}</div><div class="card mt"><h3>${t('结算后资金的去向','After settlement')}</h3><p class="subtle">${t('实际结算金额入账 GEXFI 钱包后，才可用于原有转账、兑换或卡服务。你不需要通过充值卡片才能取得赎回款。','The actual payable amount is credited to GEXFI Wallet before use in existing transfers, exchange or card services. Card funding is not required to receive your proceeds.')}</p><div class="mini-step"><span>${t('确认应付款','Confirm payable')}</span><span class="line"></span><span>${t('钱包入账','Wallet credit')}</span><span class="line"></span><span>${t('选择用途','Choose use')}</span></div></div><div class="spacer"></div>${notice(t('提交后显示“处理中”，不会立即增加可用余额。最终收益与净赎回额以结算单为准。','Submission creates a processing status; it does not immediately increase available funds. Final income and net proceeds are recorded on the settlement statement.'))}<p class="footnote">${t('本演示按每笔持仓全额结算；部分赎回未作为首期已确认功能开放。','This prototype settles a holding in full; partial redemption is not treated as an approved initial feature.')}</p></main>`+dock(t('提交模拟结算申请','Submit demo settlement request'),'redeem',`data-id="${p.id}"`)}
function timeline(rows){return`<ol class="timeline">${rows.map(([s,h,p])=>`<li class="${s}"><span class="dot"></span><div><h3>${h}</h3><p>${p}</p></div></li>`).join('')}</ol>`}
function settlementPage(pid){const p=position(pid);if(!p)return holdingsPage();if(p.status==='matured')return redemptionPage(pid);if(p.status==='active')return maturityPage(pid);const done=p.status==='redeemed',failed=p.status==='redeem_failed';return header(t('结算进度','Settlement progress'),'holding/'+p.id)+`<main class="page"><div class="result-hero"><div class="result-icon ${done?'':failed?'failed':'pending'}">${I(done?'check':failed?'info':'clock',28)}</div><h1>${done?t('已入账 GEXFI 钱包','Credited to GEXFI Wallet'):failed?t('结算需要处理','Settlement requires attention'):t('到期结算处理中','Maturity settlement in progress')}</h1><p class="subtle">${done?t('可用资金已更新；卡充值为下一笔独立交易。','Available funds have been updated. Card funding is a separate transaction.'):failed?t('本次未产生钱包入账，持仓及处理记录保留。','No wallet credit occurred. The holding and all processing records are retained.'):t('预计金额不等于已确认应付款，\n实际入账后才增加可用余额。','An estimate is not a confirmed payable.\nAvailable funds increase only after actual credit.').replace('\n','<br>')}</p><div class="large-number">${money(done?p.principal+p.actualIncome:p.principal+calc(p.principal,p.days))}<small>USDT</small></div><span class="caption">${done?t('实际净入账金额','Actual net credit'):t('目标收益情形下的示例金额','Illustrative amount at target')}</span></div><div class="card">${timeline([['done',t('持仓已到期','Term reached maturity'),fmtdate(p.end)],['done',t('申请已提交','Request submitted'),p.redemptionId||t('等待申请','Awaiting request')],[done?'done':'pending',t('核对并确认应付款','Reconcile and confirm payable'),done?t('结算单已生成','Statement generated'):failed?t('演示异常：执行失败，未入账','Demo exception: execution failed; no credit'):t('等待资产及账目核对','Awaiting reconciliation')],[done?'done':'',t('钱包入账','Wallet credit'),done?fmtdate(state.now):t('未完成，不计入可用余额','Not completed; not available funds')]])}</div>${done?`<div class="card mt">${def(t('本金','Principal'),money(p.principal)+' USDT')}${def(t('实际结算收益','Actual settled income'),money(p.actualIncome)+' USDT')}${def(t('额外扣项 · 演示','Other deductions · demo'),'0.00 USDT')}${def(t('入账参考','Credit reference'),p.creditId)}${def(t('结算后钱包可用余额','Available wallet funds'),money(available())+' USDT')}</div><div class="spacer"></div>${goBtn(t('前往卡充值','Continue to card funding'),'card-quote/'+p.id)}<div class="spacer-sm"></div>${goBtn(t('查看钱包衔接','Open wallet handoff'),'bridge/wallet','secondary')}<div class="spacer-sm"></div>${goBtn(t('再次申购 · 先核验资格','Reinvest · check eligibility'),'eligibility','secondary')}`:`<div class="spacer"></div>${failed?btn(t('重试结算申请','Retry settlement request'),'redeem','primary',`data-id="${p.id}"`):notice(t('可使用演示控制模拟“入账成功”或“执行失败”，查看余额变化。生产中仅接收真实服务端状态。','Demo controls can simulate credit or execution failure. Production accepts only authoritative server events.'))}<div class="spacer-sm"></div>${goBtn(t('联系客服','Contact support'),'support','secondary')}`}</main>`}
function cardQuotePage(pid){const p=position(pid);if(p&&p.status!=='redeemed')return settlementPage(p.id);if(!quote||quote.positionId!==pid){const amt=Math.min(1000,available()/SCALE);makeQuote(amt,pid)}return header(t('转入卡账户','Fund card account'),p?'settlement/'+p.id:'products')+`<main class="page has-dock"><div class="card-quote-visual"><div class="row"><span class="brand">GEXFI</span><span class="label">${t('卡充值衔接示意','CARD FUNDING HANDOFF')}</span></div><div><div class="label">${t('示例美元卡账户','Illustrative USD card account')}</div><strong>•••• 2048</strong></div><div class="row"><span class="label">USD ACCOUNT</span><span class="label">${t('非实际卡信息','NOT A REAL CARD')}</span></div></div><div class="card mt"><label class="input-label" for="card-amount">${t('从钱包支付','Pay from wallet')}</label><div class="amount-wrap"><input id="card-amount" type="number" inputmode="decimal" value="${quote.amount}" min="1" max="${available()/SCALE}" aria-label="${t('卡充值金额','Card funding amount')}"><span>USDT</span></div><div class="caption">${t('钱包可用','Wallet available')} ${money(available())} USDT</div><div id="card-quote-lines">${quoteLines()}</div></div><div class="spacer"></div>${notice(t('本页只演示“钱包 → 原有卡充值”资金衔接，不重做现有卡页面。实际币种、汇率、费用及限额必须取自原 Cards 报价接口。','This page illustrates the wallet-to-existing-card handoff, not a replacement card screen. Actual currencies, rates, fees and limits come from the existing Cards quote service.'))}<p class="footnote">${t('演示报价：1 USDT = 0.9985 USD、费用 1.00%、有效期 60 秒。均非已确认对外收费；报价过期须重新获取。','Demo only: 1 USDT = 0.9985 USD, 1.00% fee, valid for 60 seconds. These are not confirmed retail terms. An expired quote must be refreshed.')}</p></main>`+dock(t('确认模拟卡充值','Confirm demo card funding'),'fund-card','id="fund-card"')}
function makeQuote(a,pid){quote={id:'DEMO-Q-'+Date.now(),amount:Number(a),positionId:pid,rate:.9985,fee:.01,expires:Date.now()+60000};quote.usd=Math.round((quote.amount*(1-quote.fee)*quote.rate)*100)/100;quote.input=quote.amount}
function quoteLines(){return def(t('示例成交汇率','Illustrative execution rate'),'1 USDT = '+quote.rate+' USD')+def(t('示例服务费','Illustrative service fee'),num(quote.amount*quote.fee)+' USDT')+def(t('预计卡内入账','Expected card credit'),`<strong>${num(quote.usd)} USD</strong>`)+def(t('报价状态','Quote status'),`<span id="quote-status">${t('60 秒内有效','Valid for 60 seconds')}</span>`)}
function cardResultPage(cid){const c=state.cardOrders.find(c=>c.id===cid);if(!c)return productsPage();const done=c.status==='completed';return header(t('卡充值记录','Card funding record'),'activity')+`<main class="page"><div class="result-hero"><div class="result-icon ${done?'':c.status==='failed'?'failed':'pending'}">${I(done?'check':c.status==='failed'?'info':'clock',28)}</div><h1>${statusLabel(c.status)}</h1><p class="subtle">${done?t('模拟收到渠道成功结果，美元卡余额已更新。','A provider-success event has been simulated. The demo USD card balance is updated.'):c.status==='failed'?t('未完成卡充值，预留的 USDT 已原路释放。','Card funding was not completed; the USDT reservation was released.'):t('钱包金额已预留，等待卡渠道确认；卡余额尚未增加。','Wallet funds are reserved. The card balance does not increase until provider confirmation.')}</p><div class="large-number">${num(c.usd)}<small>USD</small></div></div><div class="card">${def(t('卡充值订单','Card order'),c.id)}${def(t('钱包支付金额','Wallet amount'),money(c.principal)+' USDT')}${def(t('示例汇率','Demo rate'),c.rate.toString())}${def(t('示例费用','Demo fee'),num(c.principal/SCALE*c.fee)+' USDT')}${def(t('卡入账状态','Card credit status'),done?t('已确认','Confirmed'):t('未入账','Not credited'))}${def(t('模拟卡余额','Demo card balance'),num(state.cardUSD)+' USD')}</div><div class="spacer"></div>${c.status==='processing'?notice(t('通过演示控制模拟渠道成功或失败。重复成功事件不会重复扣款或充值。','Simulate provider success or failure via Demo controls. Repeated success events do not duplicate debit or credit.')):''}<div class="spacer"></div>${goBtn(t('返回我的收益','Back to holdings'),'holdings','secondary')}</main>`}
function activityPage(){return header(t('收益宝交易记录','Income activity'),'holdings')+`<main class="page"><div class="tab-filters">${[['all',t('全部','All')],['purchase',t('购 U','Buy USDT')],['subscription',t('申购','Subscribe')],['redemption',t('赎回','Redeem')],['card',t('转卡','Card')]].map(([v,l])=>btn(l,'activity-filter',v===activityFilter?'active':'',`data-value="${v}"`)).join('')}</div><div class="card tight">${state.events.filter(e=>activityFilter==='all'||e.type===activityFilter).map(e=>`<button class="list-item" data-go="event/${e.id}"><div><span class="list-title">${esc(lang==='zh'?e.title[0]:e.title[1])}</span><p>${fmtdate(e.date)} · ${e.ref}</p></div><div class="right"><strong>${e.amount>0?'+':''}${money(e.amount)}</strong><small>USDT ${I('chevron',10)}</small></div></button>`).join('')||`<div class="empty">${I('file',32)}<h3>${t('还没有新交易记录','No new activity yet')}</h3><p>${t('模拟申购、取消、结算或转卡后，\n这里会保留对应记录。','Simulate a subscription, cancellation,\nsettlement or card funding to see records.').replace('\n','<br>')}</p></div>`}</div><p class="footnote">${t('这里仅列收益模块相关活动。现有钱包、汇兑及卡交易记录页保持不变。','This view contains Income-related activity only. Existing wallet, FX and card histories are unchanged.')}</p></main>`}
function eventPage(eid){const e=state.events.find(e=>e.id===eid);if(!e)return activityPage();return header(t('交易详情','Activity details'),'activity')+`<main class="page"><div class="card">${def(t('事件','Event'),esc(lang==='zh'?e.title[0]:e.title[1]))}${def(t('金额变化','Movement'),money(e.amount)+' USDT')}${def(t('业务编号','Reference'),e.ref)}${def(t('记录编号','Record ID'),e.id)}${def(t('业务日期','Business date'),fmtdate(e.date))}${def(t('演示操作时间','Demo action time'),e.at)}</div><div class="spacer"></div>${notice(t('记录为本地演示操作轨迹，不是实际银行或链上凭据。资金预留、持仓建立与到账分别记账。','This is a local demo audit trail, not a bank or on-chain proof. Reservations, accepted holdings and actual credits are recorded separately.'))}</main>`}
function memoPage(section){const labels=D.memo.labels[lang],sections=D.memo.sections[lang];if(section){const s=sections.find(x=>x.id===section);if(!s)return memoPage();return header(s.title,'memo')+`<article class="memo-body"><div class="eyebrow">${s.number} / GEX USDT INCOME</div><h1 style="font-size:23px;line-height:1.4">${s.title}</h1><p>${s.intro}</p>${s.body}<div class="spacer"></div>${goBtn(t('返回文件目录','Back to contents'),'memo','secondary')}<p class="caption">v1.0 · 2026-10-08</p></article>`}return header(t('投资说明书','Investment Memorandum'),consent.memo||route.includes('memo')?'products':'products')+`<main class="page"><div class="eyebrow">PRODUCT DOCUMENTS</div><h1>${labels.document}</h1><div class="subtle">GEX USDT Income</div><p class="caption">${labels.scope}</p><div class="row" style="margin:20px 0"><span class="pill">v1.0 · 2026-10-08</span>${btn(I('download',15)+' PDF','download-pdf','link')}</div>${notice(labels.risk)}<div class="memo-index">${sections.map(s=>`<button class="list-item" data-go="memo/${s.id}"><div class="row start"><span class="caption">${s.number}</span><span class="list-title" style="margin:0">${s.title}</span></div>${I('chevron',14)}</button>`).join('')}</div><p class="caption" style="margin-top:15px">${labels.status}</p><div class="button-pair">${btn(t('下载中文 PDF','Chinese PDF'),'download-pdf','secondary','data-lang="zh"')}${btn(t('下载英文 PDF','English PDF'),'download-pdf','secondary','data-lang="en"')}</div><div class="spacer"></div>${goBtn(t('返回申购确认','Back to subscription review'),'review','secondary')}</main>`}
function rulesPage(){return header(t('产品规则与风险','Rules & risks'),'products')+`<main class="page"><div class="card"><h3>${t('已确认的产品口径','Confirmed product basis')}</h3>${def('90 '+t('天','days'),'3.80% '+t('目标年化','net target p.a.'))}${def('180 '+t('天','days'),'4.50% '+t('目标年化','net target p.a.'))}${def('365 '+t('天','days'),'5.00% '+t('目标年化','net target p.a.'))}${def(t('管理费','Management fee'),t('0.50%/年已反映于目标收益','0.50% p.a. reflected in target'))}${def(t('计算','Calculation'),'ACT/365 · '+t('单利','simple interest'))}${def(t('申购资金','Funding'),t('已结算合资格 GEXFI 购U','Eligible settled GEXFI purchases'))}${def(t('赎回与续投','Exit & renewal'),t('到期结算，不自动续投','Maturity settlement; no auto-renewal'))}</div><div class="card mt"><h3>${t('理解三类收益数值','Understand three income figures')}</h3><p class="subtle">${t('预计收益：按目标利率的试算及计提展示。\n已确认收益：经过实际结算核对的应付款。\n已入账收益：已完成钱包入账的金额。','Estimated income: illustrations using the target rate.\nConfirmed income: payable income after actual reconciliation.\nCredited income: completed wallet credits.').replaceAll('\n','<br><br>')}</p></div><div class="spacer"></div>${notice(t('目标收益不保证，本金存在风险。固定期限不适合作为应急或短期消费资金。','Target returns are not guaranteed and capital is at risk. Fixed-term holdings are not emergency or short-term spending funds.'),'warn')}<div class="spacer"></div>${goBtn(t('阅读全文与风险披露','Read the full memorandum'),'memo')}</main>`}
function bridgePage(type){const m={buy:[t('购买 USDT','Buy USDT'),t('现有汇兑页面','Existing Exchange'),t('完成原有购U及到账审核后，由服务端刷新可申购金额。收益宝不另建入金通道。','After the existing purchase and settlement process, the server refreshes eligible funds. Income does not add a new deposit rail.')],kyc:[t('账户认证','Account verification'),t('现有认证中心','Existing verification centre'),t('继续使用当前账户与认证状态，不重复注册或单独创建客户资料。','Reuse the existing account and verification status, without a duplicate registration or client record.')],card:[t('卡账户','Card account'),t('现有卡页面','Existing Cards'),t('底部“银联卡”入口不改名、不换页面。收益宝到卡的资金请求交给现有卡充值流程。','Do not rename or replace the existing UnionPay tab. Income hands funding requests to the existing card flow.')],wallet:[t('钱包','Wallet'),t('现有资产页面','Existing wallet'),t('钱包只接收实际结算完成的入账。收益持仓和预留不重复计入可用余额。','Wallet receives completed settlement credits only. Holdings and reservations are not double-counted as available funds.')]}[type]||[type,t('现有服务','Existing service'),''];return header(m[0],'products')+`<main class="page"><div class="card empty">${I(type==='card'?'card':type==='buy'?'exchange':type==='kyc'?'shield':'wallet',36)}<h3>${m[1]}</h3><p>${m[2]}</p>${pill(t('保留原页面 · 仅接口衔接','Original page retained · handoff only'))}</div><div class="card mt"><h3>${t('集成边界','Integration boundary')}</h3><p class="subtle">${t('你提供的是现有页面截图和官网代码包，没有当前 H5 工程。本演示不虚构这些页面的代码或真实地址。IT 将这一入口绑定现有 router / service。','The supplied materials include screenshots and the website package, not the live H5 source. This prototype does not invent existing page code or routes. IT binds this handoff to the current router and service.')}</p></div><div class="spacer"></div>${goBtn(t('返回收益宝','Back to Income'),'products','secondary')}</main>`}
function supportPage(){return header(t('帮助与联系','Help & contact'),'products')+`<main class="page"><div class="card"><div class="row start"><span class="list-icon">${I('support',22)}</span><div><h3>GEXFI</h3><div class="caption">${t('账户与收益产品支持','Account & Income product support')}</div></div></div><p class="subtle">${t('请提供订单编号与问题描述。不要发送密码、私钥或完整卡片凭据。','Include your order reference and issue description. Do not send passwords, private keys or full card credentials.')}</p><a class="primary" href="mailto:info@gexfi.com">info@gexfi.com</a></div><div class="card mt tight"><button class="list-item" data-go="rules"><span>${t('收益与到期规则','Income & maturity rules')}</span>${I('chevron',14)}</button><button class="list-item" data-go="eligibility"><span>${t('为什么余额不能全部申购？','Why is some balance ineligible?')}</span>${I('chevron',14)}</button><button class="list-item" data-go="memo"><span>Investment Memorandum</span>${I('chevron',14)}</button></div></main>`}
function render(){route=(location.hash.replace(/^#\/?/,'')||'home');const parts=route.split('/'), r=parts[0],v=parts[1];let html='';switch(r){case'home':case'me':case'more':case'exchange':html=originalPage(r);break;case'buy':html=buyPage(v||chosen);break;case'checkout':html=checkoutPage(v);break;case'buy-order':html=buyOrderPage(v);break;case'payments':html=paymentsPage();break;case'payment-unavailable':html=paymentUnavailablePage();break;case'products':html=productsPage();break;case'product':html=productPage(pBy(v).days);break;case'eligibility':html=eligibilityPage();break;case'subscribe':html=subscribePage(pBy(v).days);break;case'review':html=reviewPage();break;case'order':html=orderPage(v);break;case'holdings':html=holdingsPage();break;case'holding':html=holdingPage(v);break;case'income':html=dailyPage(v);break;case'receipt':html=receiptPage(v);break;case'chain':html=chainPage(v);break;case'maturity':html=maturityPage(v);break;case'early':html=earlyPage(v);break;case'redeem':html=redemptionPage(v);break;case'settlement':html=settlementPage(v);break;case'card-quote':html=cardQuotePage(v);break;case'card-result':html=cardResultPage(v);break;case'activity':html=activityPage();break;case'event':html=eventPage(v);break;case'memo':html=memoPage(v);break;case'rules':html=rulesPage();break;case'bridge':html=bridgePage(v);break;case'support':html=supportPage();break;case'export':downloadDaily(position(v));go('income/'+v);return;default:html=productsPage();}

function createBuy(){

  if(!buyConsent){toast(t('请核对报价并勾选确认。','Review the quote and confirm it.'));return null;}
  const old=state.fiatOrders.find(o=>o.quoteId===buyQuote.id);if(old){go('checkout/'+old.id);return old;}
  const o={id:id('BUY'),paymentId:id('PAY'),quoteId:buyQuote.id,days:chosen,amount:buyQuote.amount,currency:'CNY',totalMinor:buyQuote.totalMinor,customerRate:buyQuote.customerRate,channelFeeMinor:0,method:'demo_checkout',status:'awaiting_payment',createdAt:new Date().toISOString(),date:state.now,expires:Date.now()+FIAT_DEMO.paymentTTL*1000,receivedMinor:0,credited:false,refundId:null,history:[],paymentPurpose:'USDT_PURCHASE',creditId:null,checkedAt:null};

function paymentControls(o){
